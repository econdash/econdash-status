# Upptime for econdash.org (ECO-66). Docs: https://upptime.js.org/docs/configuration
owner: econdash
repo: econdash-status

# Checks run from GitHub Actions runners every 5 minutes (GitHub's minimum).
# USER_AGENT secret = "EconDash-Agent/status …", which nginx already exempts from the bot block ($our_ua).
sites:
  - name: Website
    url: https://econdash.org/
    maxResponseTime: 5000
  - name: Explore dashboard
    url: https://econdash.org/explore
    maxResponseTime: 5000
  - name: Chart page (data rendered)
    url: https://econdash.org/chart/gdp-nominal/USA
    maxResponseTime: 5000
    # Dataset JSON-LD is rendered only when the series has data: catches "200 with an empty chart".
    __dangerous__body_down_if_text_missing: '"temporalCoverage"'
  - name: Data API
    url: https://econdash.org/api/v1/timeseries/world_bank__gdp_nominal?country=USA&limit=1
    maxResponseTime: 3000
    __dangerous__body_down_if_text_missing: '"data_points"'
  - name: Agent payments (x402/MPP 402)
    url: https://econdash.org/api/v1/m2m/stats
    expectedStatusCodes:
      - 402
    maxResponseTime: 3000
    # Exactly 402 with the payment challenge, not any 4xx and not an open 200.
    __dangerous__body_down_if_text_missing: '"x402-v2"'
  - name: llms.txt
    url: https://econdash.org/llms.txt
    maxResponseTime: 3000
  - name: Sitemap
    url: https://econdash.org/sitemap.xml
    maxResponseTime: 10000
  - name: Data updates feed
    url: https://econdash.org/feeds/updates.xml
    maxResponseTime: 3000
    __dangerous__body_down_if_text_missing: "<feed"
  - name: OpenAPI spec
    url: https://econdash.org/openapi.json
    maxResponseTime: 3000
  # MCP server for AI assistants (ECO-84): initialize, tools/list and one data call.
  # Stateless transport, so each check is one POST. The User-Agent stays EconDash-Agent/status,
  # which the MCP metrics count as our own traffic, apart from users. tools/call answers come
  # from a 10-minute cache, so a database outage shows here within 10 minutes.
  - name: MCP initialize
    url: https://mcp.econdash.org/mcp
    method: POST
    headers:
      - "Content-Type: application/json"
      - "Accept: application/json, text/event-stream"
      # With custom headers Upptime sends its own User-Agent (upptime.js.org); name ours.
      - "User-Agent: EconDash-Agent/status (+https://status.econdash.org; Upptime)"
    body: '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"EconDash-Agent/status","version":"1"}}}'
    maxResponseTime: 3000
    __dangerous__body_down_if_text_missing: '"serverInfo"'
  - name: MCP tools/list
    url: https://mcp.econdash.org/mcp
    method: POST
    headers:
      - "Content-Type: application/json"
      - "Accept: application/json, text/event-stream"
      # With custom headers Upptime sends its own User-Agent (upptime.js.org); name ours.
      - "User-Agent: EconDash-Agent/status (+https://status.econdash.org; Upptime)"
    body: '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
    maxResponseTime: 3000
    __dangerous__body_down_if_text_missing: '"get_indicator_series"'
  - name: MCP tools/call (data)
    url: https://mcp.econdash.org/mcp
    method: POST
    headers:
      - "Content-Type: application/json"
      - "Accept: application/json, text/event-stream"
      # With custom headers Upptime sends its own User-Agent (upptime.js.org); name ours.
      - "User-Agent: EconDash-Agent/status (+https://status.econdash.org; Upptime)"
    body: '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"get_indicator_series","arguments":{"indicator":"gdp-nominal","country":"USA","year":2020}}}'
    maxResponseTime: 3000
    # A tool error (no data, database down) comes back as HTTP 200 with "isError":true.
    __dangerous__body_down_if_text_missing: '"isError":drill'

# No raw "<" in intro texts: sapper export then silently skips index.html.
status-website:
  cname: status.econdash.org
  logoUrl: https://econdash.org/icon.png
  name: EconDash Status
  introTitle: "**EconDash** service status"
  introMessage: >-
    Live availability and response times of [econdash.org](https://econdash.org), its data API and
    agent payments (x402 / MPP), checked every 5 minutes from outside our server.
    **Service level objective:** site and API availability at least 99.5% per month.
  navbar:
    - title: Status
      href: /
    - title: EconDash
      href: https://econdash.org
    - title: API docs
      href: https://econdash.org/docs/endpoints
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

